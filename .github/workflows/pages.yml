name: Deploy Alvernia Logins to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'reference/source-catalog.json'
      - 'reference/navigation-source.json'
      - 'HANDOFF.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Validate services and source files
        run: node scripts/verify-catalog.cjs .
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build the Classic homepage
        run: python3 scripts/build-pages.py
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
